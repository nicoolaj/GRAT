# cargo-deny config. Run with `make audit` (or `cargo deny check`).
# ponytail: allow list is exactly what this dependency graph currently uses —
# widen it if a new dependency needs a license not listed here.

[advisories]
ignore = [
    # ttf-parser 0.25.1, pulled in transitively via winit's sctk-adwaita on Linux;
    # upstream has no maintained replacement wired through winit yet. Revisit when
    # winit/ab_glyph moves to skrifa.
    "RUSTSEC-2026-0192",
]

[licenses]
private = { ignore = true } # grat is publish = false, not shipped to crates.io

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
