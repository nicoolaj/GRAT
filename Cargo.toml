[package]
name = "strungin"
version = "1.4.0"
edition = "2021"
authors = ["Nicolas Jalibert <nicoolaj@gmail.com>"]
description = "Six-string guitar tablature editor: place notes by mouse, print an A4 PDF"
repository = "https://github.com/nicoolaj"
license = "CC-BY-NC-SA-4.0"

# lib + bin: the core (model, engraving, layout, PDF) is a library that is testable
# without a GUI; the binary only adds eframe/canvas/menu on top.
[lib]
path = "src/lib.rs"

[[bin]]
name = "strungin"
path = "src/main.rs"

[dependencies]
# "persistence" is not in eframe's default feature set (verified against the downloaded
# source) but is required for Storage (used to persist the manually-picked UI language).
eframe = { version = "0.36", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
printpdf = { version = "0.12", default-features = false }
rfd = "0.17"
sys-locale = "0.3"
# Only the jpeg decoder: src/assets/cover.jpg is the one image this app ever reads.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
lto = true
strip = true
